# ============================================================================================
# Countries, Wikipedia pages and incumbents for the polling dashboard
# ============================================================================================
# Everything the pipeline needs to know that is NOT in the polling tables lives here.
# Edit this file when a government changes or an election is called, then re-run:
#     python -m polls build
#
# Per country:
#   name, region            display only
#   next_election           date the x-axis ends at (YYYY-MM-DD)
#   next_election_status    scheduled | expected | deadline   (deadline = latest legal date)
#   incumbents              who held the head-of-government office, as dated periods.
#                           `match` lists party keys/labels as they appear in the polling table
#                           (case-insensitive; the Wikipedia article title of the party, or the
#                           column label). An empty match = caretaker / non-party PM, no line.
#                           The thick "incumbent" line follows these periods, so a mid-term
#                           change of PM party (e.g. Romania 2025) switches the line.
#   cycles                  Wikipedia pages, newest first. `start` = election that opened the
#                           cycle; `end` = election that closed it (omit for the running cycle).
#                           If the running cycle has fewer than `min_polls` polls (an election
#                           has just happened) the dashboard shows the last completed cycle.
#   include_headings / exclude_headings / tables   (per cycle, optional) override the automatic
#                           table selection: regexes matched against "h2 > h3 > h4" headings,
#                           or explicit table indices (see data/processed/diagnostics.txt).
#   labels, colors          optional per-party display overrides (key -> text / hex colour)
#   history                 optional: party lineages for the long-run view (see Poland)
#
# Facts verified on 23 Oct 2026 against Wikipedia and news reports (see README for sources).
# ============================================================================================

