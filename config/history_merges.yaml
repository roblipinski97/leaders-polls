# ============================================================================================
# Long-run view: which party keys are the same political current across Wikipedia pages
# ============================================================================================
# Hand-curated. Each Wikipedia page names parties its own way (article titles change, parties
# rename, joint lists come and go), so the long view would otherwise break one line into many.
#   merge:   key as parsed  ->  key whose line it continues   (only renames / direct successors)
#   labels:  key -> label shown in the long view
#   drop:    keys that are not parties (stray columns)
# Poland is curated in countries.yaml (history.lineages) instead.
# ============================================================================================

AT:
  merge:
    "The Greens – The Green Alternative": "The Greens (Austria)"
