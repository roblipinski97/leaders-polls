# ============================================================================================
# Party key (as in the poll tables / long view) -> Manifesto Project party code(s)
# ============================================================================================
# Hand-kept. Only needed where automatic matching on English names and abbreviations fails
# (python -m polls build reports every match in data/processed/ideology_matches.csv).
#   key: 92435                      one Manifesto party
#   key: {codes: [92210, 92022]}    a line that continues several coded parties over time
#   key: {inherit: other key, note} no manifesto of its own; uses the party it split from or
#                                   ran inside (marked as "inherited" on the page)
#   key: null                       no score (new party, or none coded)
# Codes: MPDS 2026a. Coverage ends at different elections per country (Slovakia 2016,
# Romania 2016, Bulgaria 2017, Italy 2018, Slovenia 2018, Poland 2019 ...), so parties founded
# later have no score unless they inherit one.
# ============================================================================================

